<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- La página ya está en español: le avisamos al navegador para que no la traduzca sola
         (Chrome la tomaba como inglés y cambiaba palabras, por ejemplo "Reportes" por "Informes") -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/src/assets/img/logo_infinito_sonidos_app.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinito | Sonido e Iluminación</title>
    <!-- Tema claro u oscuro: se elige antes de dibujar la página, así no "parpadea" en claro.
         Si el usuario ya eligió uno con el botón de la barra de arriba, se usa ese; si no,
         el mismo que tiene la computadora. Ver src/hooks/useTema.js -->
    <script>
      try {
        var elegido = localStorage.getItem('infinito_tema');
        var oscuro = elegido ? elegido === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
