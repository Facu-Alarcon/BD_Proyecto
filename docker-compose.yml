# docker-compose.yml
# Orquesta tres contenedores: MySQL, phpMyAdmin y el entorno de Django.
#
# El contenedor "web" usa la imagen oficial de Python SIN Dockerfile.
# Al levantarlo instala las librerias, aplica las migraciones y arranca
# el servidor de Django solo (ver "command" en el servicio web).
# Para entrar igual al contenedor  ->  docker exec -i -t Infinito_Sonido_web bash

services:

  # ---------- Servicio 1: Base de datos MySQL ----------
  db:
    image: mysql:8.0
    container_name: Infinito_Sonido_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Servicio 2: phpMyAdmin (administrador web de MySQL) ----------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: Infinito_Sonido_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db

  # ---------- Servicio 3: Entorno de Django (Python) ----------
  web:
    image: python:3.11
    container_name: Infinito_Sonido_web
    restart: always
    # Carpeta de trabajo dentro del contenedor
    working_dir: /opt/app
    # Enlaza la carpeta local con el contenedor (codigo compartido)
    volumes:
      - .:/opt/app
    # Puerto del servidor de desarrollo de Django
    ports:
      - "8000:8000"
    # Variables de entorno que leera settings.py para conectarse a MySQL
    environment:
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      # Cuenta de Gmail para mandar la contraseña temporal a los usuarios nuevos
      # (si quedan vacías, los mails se escriben en la consola en vez de enviarse)
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      # Dirección del frontend, para el link de "Olvidé mi contraseña" (por defecto http://localhost:5173)
      FRONTEND_URL: ${FRONTEND_URL:-}
    # Lo que corre al levantar el contenedor, en este orden:
    # instala las librerias, aplica las migraciones que falten y arranca el servidor.
    # Con && si un paso falla no se ejecutan los siguientes.
    # makemigrations NO va aca: se corre a mano cuando se cambia models.py,
    # asi no se generan migraciones distintas en cada compu.
    command: >
      sh -c "pip install -r requirements.txt &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    stdin_open: true
    tty: true
    # Espera a que MySQL este listo antes de arrancar (si no, migrate falla al conectarse)
    depends_on:
      db:
        condition: service_healthy

# Volumen nombrado: conserva los datos de MySQL aunque se borre el contenedor
volumes:
  db_data:
