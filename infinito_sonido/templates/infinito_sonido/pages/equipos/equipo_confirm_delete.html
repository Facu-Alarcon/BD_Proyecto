{% extends "infinito_sonido/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Equipo</h2>
    <p>¿Seguro que querés eliminar el equipo <strong>{{ equipo.nombre_equipo }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'equipo_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
