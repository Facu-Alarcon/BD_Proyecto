{% extends "infinito_sonido/pages/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Perfiles</h2>
        <a href="{% url 'perfil_create' %}" class="btn btn-primary">+ Nuevo Perfil</a>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nombre del Perfil</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for perfil in perfiles %}
            <tr>
                <td>{{ perfil.tipo_perfil }}</td>
                <td>
                    <a href="{% url 'perfil_asignar_permisos' perfil.pk %}" class="btn btn-sm btn-info">Permisos</a>
                    <a href="{% url 'perfil_update' perfil.pk %}" class="btn btn-sm btn-warning">Editar</a>
                    <form method="post" action="{% url 'perfil_delete' perfil.pk %}" class="d-inline"
                          onsubmit="return confirm('¿Eliminar el perfil {{ perfil.tipo_perfil }}?');">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center">No hay perfiles cargados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
