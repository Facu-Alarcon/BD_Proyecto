{% extends "infinito_sonido/pages/base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Usuarios</h2>
        <a href="{% url 'usuario_create' %}" class="btn btn-primary">+ Nuevo Usuario</a>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Perfil</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.usuario }}</td>
                <td>{{ usuario.id_perfil }}</td>
                <td>
                    <a href="{% url 'usuario_update' usuario.pk %}" class="btn btn-sm btn-warning">Editar</a>
                    <form method="post" action="{% url 'usuario_delete' usuario.pk %}" class="d-inline"
                          onsubmit="return confirm('¿Eliminar al usuario {{ usuario.usuario }}?');">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center">No hay usuarios cargados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
