{% extends "infinito_sonido/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Tipo de Equipo</h2>
    <p>¿Seguro que querés eliminar el tipo de equipo <strong>{{ tipo.nombre_tipoeq }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'tipoequipo_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
